<!doctype html><html><head><meta charset="utf-8"><title>读取剪贴板</title></head>
<body style="font-family:sans-serif;padding:40px">
<h1>读取剪贴板</h1>
<button id="b" style="font-size:24px;padding:16px 32px">点我读取剪贴板</button>
<pre id="out" style="font-size:20px;word-break:break-all;margin-top:24px"></pre>
<script>
document.getElementById('b').onclick = async () => {
  const out = document.getElementById('out');
  try {
    const t = await navigator.clipboard.readText();
    out.textContent = 'OK len=' + t.length + '\n' + t;
  } catch (e) { out.textContent = 'ERR ' + e.name + ': ' + e.message; }
};
</script></body></html>
